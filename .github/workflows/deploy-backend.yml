name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # push to main -> dev automatically; manual run -> prod.
    # "prod" should have required reviewers configured on its GitHub Environment.
    environment: ${{ github.event_name == 'push' && 'dev' || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - run: npm ci

      - name: sam build
        working-directory: apps/backend
        run: sam build

      - name: sam deploy
        working-directory: apps/backend
        env:
          ENVIRONMENT: ${{ github.event_name == 'push' && 'dev' || 'prod' }}
        run: |
          sam deploy \
            --stack-name "sold-backend-${ENVIRONMENT}" \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "Environment=${ENVIRONMENT}" \
              "SupabaseUrl=${{ secrets.SUPABASE_URL }}" \
              "SupabaseServiceRoleKey=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              "R2AccountId=${{ secrets.R2_ACCOUNT_ID }}" \
              "R2AccessKeyId=${{ secrets.R2_ACCESS_KEY_ID }}" \
              "R2SecretAccessKey=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
              "R2BucketName=${{ secrets.R2_BUCKET_NAME }}" \
              "R2PublicUrl=${{ secrets.R2_PUBLIC_URL }}"

      # Vercel's Production environment tracks a dedicated "release" branch
      # (not main), so pushes to main only ever build Preview. Fast-forwarding
      # release to whatever's on main now is what actually promotes the
      # frontend, in lockstep with the backend prod deploy above -- Vercel
      # deploys Production automatically on the push, same as it always does.
      - name: promote frontend to Vercel Production
        if: github.event_name == 'workflow_dispatch'
        run: git push origin HEAD:release --force
