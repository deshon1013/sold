AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sold backend API (Express on Lambda, behind a Function URL)

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  SupabaseUrl:
    Type: String
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
  R2AccountId:
    Type: String
  R2AccessKeyId:
    Type: String
    NoEcho: true
  R2SecretAccessKey:
    Type: String
    NoEcho: true
  R2BucketName:
    Type: String
  R2PublicUrl:
    Type: String

Resources:
  BackendFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'node22'
        Sourcemap: false
        EntryPoints:
          - src/lambda.ts
    Properties:
      FunctionName: !Sub sold-backend-${Environment}
      Runtime: nodejs22.x
      Handler: lambda.handler
      CodeUri: .
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          R2_ACCOUNT_ID: !Ref R2AccountId
          R2_ACCESS_KEY_ID: !Ref R2AccessKeyId
          R2_SECRET_ACCESS_KEY: !Ref R2SecretAccessKey
          R2_BUCKET_NAME: !Ref R2BucketName
          R2_PUBLIC_URL: !Ref R2PublicUrl
          THUMBNAIL_FUNCTION_NAME: !Ref ThumbnailFunction
      # Lets the API invoke ThumbnailFunction (fire-and-forget) without a
      # hand-written IAM statement -- SAM's LambdaInvokePolicy grants exactly
      # lambda:InvokeFunction, scoped to that one function.
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ThumbnailFunction
      # CORS is handled entirely by the Express app's own cors() middleware
      # (see apps/backend/src/app.ts) -- do not also configure Cors here.
      # A Function URL's own CORS layer stacks its own Access-Control-Allow-Origin
      # header on top of the app's, and browsers reject a response carrying two
      # values for that header.
      FunctionUrlConfig:
        AuthType: NONE

  # A raw ffmpeg binary, staged into layers/ffmpeg/bin/ffmpeg by the deploy
  # workflow before `sam build` runs (see .github/workflows/deploy-backend.yml).
  # Not packaged via esbuild's External + npm -- in this npm-workspaces
  # monorepo, @ffmpeg-installer/ffmpeg gets hoisted out of
  # apps/backend/node_modules, and SAM's esbuild builder couldn't find it
  # there to copy into the deployment package. A Layer sidesteps that
  # entirely: it's a separate, independently-zipped deployment artifact.
  FfmpegLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub sold-ffmpeg-${Environment}
      ContentUri: layers/ffmpeg/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Delete

  ThumbnailFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'node22'
        Sourcemap: false
        EntryPoints:
          - src/thumbnailWorkerLambda.ts
    Properties:
      FunctionName: !Sub sold-backend-thumbnail-${Environment}
      Runtime: nodejs22.x
      Handler: thumbnailWorkerLambda.handler
      CodeUri: .
      # Video work needs real CPU/time/disk -- BackendFunction's 256MB/10s is
      # nowhere near enough for downloading + ffmpeg-processing a video file.
      MemorySize: 1536
      Timeout: 60
      EphemeralStorage:
        Size: 2048
      Layers:
        - !Ref FfmpegLayer
      # Not exposed via a Function URL -- only ever invoked directly by
      # BackendFunction via lambda:InvokeFunction, never over HTTP.
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          R2_ACCOUNT_ID: !Ref R2AccountId
          R2_ACCESS_KEY_ID: !Ref R2AccessKeyId
          R2_SECRET_ACCESS_KEY: !Ref R2SecretAccessKey
          R2_BUCKET_NAME: !Ref R2BucketName
          R2_PUBLIC_URL: !Ref R2PublicUrl

Outputs:
  FunctionUrl:
    Description: Public URL for this environment's backend -- set as VITE_API_URL on the frontend
    Value: !GetAtt BackendFunctionUrl.FunctionUrl
